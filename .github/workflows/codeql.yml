name: CodeQL

# Code scanning for the Worker, the client and these workflows. The `main`
# ruleset requires CodeQL results on every pull request (and blocks on
# high-or-higher security alerts and on errors), so this runs on each one,
# on main, and weekly for newly published queries. No build step: JavaScript,
# TypeScript and Actions are analysed from source.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
