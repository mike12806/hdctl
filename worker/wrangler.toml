name = "hdctl"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# Not secret; same account as gh_hdc's workers.
account_id = "894cecec36bc067ca606c3834d8ae7bc"

# Only reachable at hdctl.mfaherty.net, which sits behind the Cloudflare Access
# app `hdctl` (gh_hdc terraform/cloudflare-access/apps.tf). workers.dev and
# preview URLs would bypass that app, so both stay off.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "hdctl.mfaherty.net", custom_domain = true },
]

# The React build, served by this Worker. run_worker_first = true sends every
# request, assets included, through src/index.ts, so nothing is served without
# a valid Access JWT, even if the Access app were misconfigured.
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Records health-check history every two minutes; see src/health.ts. The
# Status page itself always probes live.
[triggers]
crons = ["*/2 * * * *"]

# D1 holds only what no backend API can give back: check history (for uptime
# and the history strip) and the audit log. Everything a page shows about the
# lab's current state is fetched live from its source on each request.
[[d1_databases]]
binding = "DB"
database_name = "hdctl-db"
# Created by the first deploy (--location enam, next to the tunnel's BOS/EWR
# connectors). The deploy checks this still matches hdctl-db's id.
database_id = "d8fbbaa2-ed8e-4104-84d2-b1cb92aefd90"
migrations_dir = "migrations"

# A cache that can't serve stale data: entries are only ever used after the
# origin confirms them (HTTP If-None-Match -> 304), so KV's eventual
# consistency can cost a refetch but never a stale answer. See src/cache.ts.
# Only GitHub qualifies today; Argo CD and Proxmox give no validators, so they
# are never cached.
[[kv_namespaces]]
binding = "CACHE"
# hdctl-cache, created by the first deploy. The deploy checks this still matches.
id = "d4206a06e16d4e55861592e640efddd2"

[observability]
enabled = true
head_sampling_rate = 1

# Also export logs (OTLP) to Redpanda -> Elasticsearch, like gh_hdc's workers.
# "redpanda-logs" is the account's Observability destination.
[observability.logs]
enabled = true
destinations = ["redpanda-logs"]

[vars]
CF_ACCESS_TEAM_DOMAIN = "mfaherty.cloudflareaccess.com"
# AUD tag of the Access app for hdctl.mfaherty.net. Every run of gh_hdc's
# cloudflare-access workflow prints it in the job summary. The deploy fails
# while this is still the placeholder.
CF_ACCESS_AUD = "e4caaecc9c2ff4ba8fd37f954797bd6a6b70b0aaa294d458b2db38648b09590a"
# Belt and braces on top of the Access policy: the JWT's email must be one of
# these. Comma-separated.
ALLOWED_EMAILS = "michaelefaherty@gmail.com"
# Repositories whose Actions runs hdctl shows and can dispatch.
GITHUB_REPOS = "mike12806/gh_hdc,mike12806/public-jobs"
# The deployed build; deploy.yml overrides it with the git SHA (--var), and the
# client is built with the same value. A mismatch tells an open tab to reload.
BUILD_ID = "dev"

# Secrets (never here), set by .github/workflows/deploy.yml from Vault:
#   ARGOCD_TOKEN   API token of the Argo CD local account `hdctl`
#   PVE_TOKENS     JSON {"pve": "USER@REALM!TOKENID=SECRET", ...}, keyed by target id
#   GITHUB_TOKEN   PAT that can read Actions and dispatch workflows
# For local dev, put them in worker/.dev.vars along with DEV_MODE=true.

# Workers VPC: one pinned service per target in infra/targets.json.
# BEGIN vpc_services (generated by `npm run vpc:sync` from infra/targets.json; do not edit by hand)
